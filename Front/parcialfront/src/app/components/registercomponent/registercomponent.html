<section class="card-register">
  <div class="register-text">
    <h1 class="titulo">Registrarse</h1>
    <p>Crea tu cuenta para poder hacer compras ingresando tus siguientes datos</p>
  </div>
  <div class="register-form">
    <form>
      <label for="fieldText" class="form-label">Nombre de usuario</label>
      <input type="text" class="form-control" id="fieldText" placeholder="ej: AnaPerez123">

      <label for="fieldText" class="form-label">Contraseña</label>
      <input type="password" class="form-control" id="fieldText" placeholder="Ej: elpanaderoconelpantumtum">
    </form>
  </div>
  <button routerLink="/login">Iniciar sesión</button>
</section>
